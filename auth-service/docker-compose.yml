version: "3.9"

# ---------------------------------------------------------------
# Auth Service — Local Development Compose Stack
#
#   docker-compose up          → start all services
#   docker-compose up --build  → rebuild app image
#   docker-compose down -v     → tear down + delete volumes
# ---------------------------------------------------------------

services:

  # ── Application ─────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: auth-service:local
    container_name: auth_service_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      FLASK_ENV: development
      FLASK_APP: wsgi:application
      SECRET_KEY: dev-secret-key-change-in-prod
      JWT_SECRET_KEY: dev-jwt-secret-change-in-prod
      DATABASE_URL: postgresql://auth_user:auth_pass@db:5432/auth_db
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: DEBUG
    volumes:
      # Mount source for live reload in development
      - .:/app:cached
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        flask db upgrade &&
        gunicorn --bind 0.0.0.0:5000 --workers 2 --reload wsgi:application
      "
    networks:
      - auth_net

  # ── PostgreSQL ───────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: auth_service_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
      POSTGRES_DB: auth_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_user -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - auth_net

  # ── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: auth_service_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ""
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - auth_net

  # ── pgAdmin (optional, dev only) ─────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: auth_service_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - auth_net
    profiles:
      - admin   # Only starts when: docker-compose --profile admin up

volumes:
  postgres_data:
  redis_data:

networks:
  auth_net:
    driver: bridge
