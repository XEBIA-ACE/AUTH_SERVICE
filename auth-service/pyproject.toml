[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "auth-service"
version = "1.0.0"
description = "Production-ready OAuth 2.0 Authentication Service"
requires-python = ">=3.12"

# ── Ruff (linter + formatter) ───────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit (security)
    "N",   # pep8-naming
]
ignore = [
    "S101",  # assert used in tests is fine
    "S105",  # hardcoded password — handled by env vars
    "B008",  # do not perform function calls in argument defaults (Flask patterns)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N"]   # Relax security + naming rules in tests

# ── Pytest ──────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: fast unit tests (no DB or network)",
    "integration: tests that require the Flask app context",
    "slow: tests that are expected to run slowly",
]

# ── Coverage ────────────────────────────────────────────────────
[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "migrations/*", "wsgi.py"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 70

# ── Mypy ────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false
warn_return_any = true
warn_unused_configs = true
